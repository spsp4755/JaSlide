[project]
name = "jaslide-renderer"
version = "0.1.0"
description = "PPTX/PDF rendering service for JaSlide"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
    "python-pptx==1.0.2",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "playwright==1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
