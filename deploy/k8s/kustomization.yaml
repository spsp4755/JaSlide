apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jaslide
resources:
  - namespace.yaml
  - jaslide-k8s.yaml
# 다음 릴리즈부터는 jaslide-k8s.yaml을 건드리지 않고 아래 newTag 5개만 바꾼 뒤
# `kubectl apply -k deploy/k8s`를 실행하면 됩니다. 태그가 바뀌면 k8s가 자동으로
# 롤링 재시작하므로 별도 `kubectl rollout restart`는 필요 없습니다.
images:
  - name: harbor.CHANGE_ME/jaslide/api
    newTag: v0.5.0
  - name: harbor.CHANGE_ME/jaslide/web
    newTag: v0.5.0
  - name: harbor.CHANGE_ME/jaslide/renderer
    newTag: v0.5.0
  - name: harbor.CHANGE_ME/jaslide/postgres
    newTag: v0.5.0
  - name: harbor.CHANGE_ME/jaslide/redis
    newTag: v0.5.0
