services:
  postgres:
    image: jaslide/postgres:${JASLIDE_VERSION:-v0.8.0}
    platform: linux/amd64
    pull_policy: never
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: jaslide/redis:${JASLIDE_VERSION:-v0.8.0}
    platform: linux/amd64
    pull_policy: never
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  renderer:
    image: jaslide/renderer:${JASLIDE_VERSION:-v0.8.0}
    platform: linux/amd64
    pull_policy: never
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    image: jaslide/migrate:${JASLIDE_VERSION:-v0.8.0}
    platform: linux/amd64
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: jaslide/core-api:${JASLIDE_VERSION:-v0.8.0}
    platform: linux/amd64
    pull_policy: never
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-4096}
      LLM_ALLOWED_ENDPOINTS: ${LLM_ALLOWED_ENDPOINTS:-}
      LLM_ALLOWED_API_KEY_ENV_VARS: ${LLM_ALLOWED_API_KEY_ENV_VARS:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-}
      KEYCLOAK_ADMIN_ROLES: ${KEYCLOAK_ADMIN_ROLES:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      RENDERER_URL: http://renderer:8000
      LOCAL_STORAGE_PATH: /app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      renderer:
        condition: service_healthy
    volumes:
      - assets_data:/app/apps/api/uploads

  web:
    image: jaslide/web:${JASLIDE_VERSION:-v0.8.0}
    platform: linux/amd64
    pull_policy: never
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login | grep -q 'id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  redis_data:
  assets_data:
